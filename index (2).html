<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Foto con marco</title>
  
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
    }

    .principal {
      width: 700px;
      margin: 0 auto;
      border: 1px solid #000;
      padding: 20px;
      background-color: #f9f9f9;
      position: relative;
    }

    .caja1 {
      position: relative;
      width: 320px;
      height: 240px;
      margin: 0 auto;
      border: 1px solid #000;
      background-color: #000;
    }

    #camera {
      width: 320px;
      height: 240px;
      object-fit: fill;
      display: block;
    }

    #marcoCanva {
      position: absolute;
      top: 2.5px;
      left: -2px;
      width: 319px;
      height: 239px;
      object-fit: fill;
      pointer-events: none;
      z-index: 10;
    }

    .centro {
      text-align: center;
      margin-top: 15px;
      margin-bottom: 25px;
    }

    .btn {
      width: 140px;
      height: 35px;
      margin: 0 5px;
      background-color: #3340f3;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    .caja2 {
      position: relative;
      width: 320px;
      height: 240px;
      margin: 0 auto;
      border: 1px solid #000;
      background-color: #fff;
    }

    #myCanvas {
      width: 320px;
      height: 240px;
      display: block;
    }
  </style>
</head>

<body>

  <div class="principal">
    <div class="caja1">
      <video autoplay id="camera" width="320" height="240"></video>
      <img id="marcoCanva" src="/Captura_de_pantalla_2026-09-14_125256-removebg-preview.png" alt="Marco">
    </div>
    
    <div class="centro">
      <input class="btn" type="button" id="btnStart" value="Iniciar Cámara">
      <input class="btn" type="button" id="btnSnapshot" value="Tomar Foto">
      <input class="btn" type="button" id="btnDownload" value="Descargar Foto">
    </div>
    
    <div class="caja2">
      <canvas id="myCanvas" width="320" height="240"></canvas>
    </div>
  </div>

  <script>
    var video = document.getElementById("camera");
    var canvas = document.getElementById("myCanvas");
    var camera = false;
    let currentStream = null;
    var capturedImage = false;
    var btnStart = document.getElementById("btnStart");
    var btnSnapshot = document.getElementById("btnSnapshot");
    var btnDownload = document.getElementById("btnDownload");
    var ctx = canvas.getContext('2d');

    btnStart.onclick = StartCamera;
    btnSnapshot.onclick = snapshot;
    btnDownload.onclick = download;

    function StartCamera() {
      if (!camera) {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          navigator.mediaDevices.getUserMedia({ video: true })
            .then(function (stream) {
              currentStream = stream;
              video.srcObject = currentStream;
              camera = true;
              btnStart.value = "Detener Cámara";
            })
            .catch(function (err) {
              alert("Error al acceder a la cámara: " + err.name);
            });
        } else {
          alert("Navegador no compatible.");
        }
      } else {
        camera = false;
        if (currentStream) {
          currentStream.getTracks().forEach(track => track.stop());
        }
        video.srcObject = null;
        btnStart.value = "Iniciar Cámara";
      }
    }

    function snapshot() {
      if (camera) {
        var marco = document.getElementById("marcoCanva");

        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        ctx.drawImage(marco, -2, 2.5, canvas.width - 1, canvas.height - 1);

        capturedImage = true;
      } else {
        window.alert('Por favor, inicia la cámara');
      }
    }

    function download() {
      if (capturedImage) {
        var link = document.createElement('a');
        link.download = 'Captura_' + (Math.floor(Date.now() / 1000)) + '.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      } else {
        window.alert('Por favor, toma una foto para descargarla');
      }
    }
  </script>

</body>
</html>
